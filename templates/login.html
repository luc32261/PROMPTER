<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Prompt Builder</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100vw;
            background-color: var(--bg-base);
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        .login-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 8px;
        }

        .login-header .logo {
            font-size: 1.4rem;
        }

        .login-subtitle {
            font-size: 0.88rem;
            color: var(--text-secondary);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-input {
            background-color: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }

        .form-input:focus {
            border-color: var(--accent-primary);
        }

        .login-error {
            background-color: var(--danger-subtle);
            border: 1px solid var(--danger-color);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            text-align: center;
        }

        .btn-login {
            width: 100%;
            padding: 10px;
            font-size: 0.95rem;
            margin-top: 4px;
        }

        .auth-footer {
            margin-top: 8px;
            text-align: center;
            font-size: 0.88rem;
            color: var(--text-secondary);
        }

        .auth-link {
            color: var(--accent-primary);
            text-decoration: none;
            font-weight: 500;
        }

        .auth-link:hover {
            text-decoration: underline;
        }

        .admin-gate-corner {
            position: fixed;
            bottom: 16px;
            right: 16px;
        }

        .admin-gate-link {
            color: var(--text-muted, #52525b);
            font-size: 0.75rem;
            text-decoration: none;
            opacity: 0.4;
            transition: opacity 0.2s, color 0.2s;
        }

        .admin-gate-link:hover {
            opacity: 0.9;
            color: var(--text-secondary, #a1a1aa);
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                    <h1>Prompt Builder</h1>
                </div>
                <p class="login-subtitle">Sign in to your account</p>
            </div>

            {% if error %}
            <div class="login-error">{{ error }}</div>
            {% endif %}

            <form class="login-form" method="POST" action="/login">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-input" 
                        placeholder="Enter username" 
                        value="{{ username or '' }}"
                        required 
                        {% if not username %}autofocus{% endif %}
                    >
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input" 
                        placeholder="Enter password" 
                        required 
                        {% if username %}autofocus{% endif %}
                    >
                </div>
                <button type="submit" class="btn btn-primary btn-login">Sign in</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="/register" class="auth-link">Create one</a>
            </div>
        </div>
        <div class="admin-gate-corner">
            <a href="/admin/gate" class="admin-gate-link">Admin</a>
        </div>
    </div>
</body>
</html>
