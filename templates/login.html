<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login - Prompt Builder</title>
    <link rel="stylesheet" href="/static/style.css?v=20260922">
    <style>
        html, body {
            overflow-x: hidden;
            width: 100%;
        }

        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            background-color: var(--bg-base);
            padding: 20px 16px;
            box-sizing: border-box;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 32px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
        }

        .login-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 8px;
        }

        .login-header .logo {
            font-size: 1.4rem;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
            cursor: default;
        }

        .login-header .logo.press-pulse {
            transform: none;
        }

        .login-subtitle {
            font-size: 0.88rem;
            color: var(--text-secondary);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-input {
            background-color: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }

        .form-input:focus {
            border-color: var(--accent-primary);
        }

        .login-error {
            background-color: var(--danger-subtle);
            border: 1px solid var(--danger-color);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            text-align: center;
        }

        .btn-login {
            width: 100%;
            padding: 10px;
            font-size: 0.95rem;
            margin-top: 4px;
        }

        .auth-footer {
            margin-top: 8px;
            text-align: center;
            font-size: 0.88rem;
            color: var(--text-secondary);
        }

        .auth-link {
            color: var(--accent-primary);
            text-decoration: none;
            font-weight: 500;
        }

        .auth-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-header">
                <div class="logo" id="app-logo">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                    <h1>Prompt Builder</h1>
                </div>
                <p class="login-subtitle">Sign in to your account</p>
            </div>

            {% if error %}
            <div class="login-error">{{ error }}</div>
            {% endif %}

            <form class="login-form" method="POST" action="/login">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-input" 
                        placeholder="Enter username" 
                        value="{{ username or '' }}"
                        required 
                        {% if not username %}autofocus{% endif %}
                    >
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input" 
                        placeholder="Enter password" 
                        required 
                        {% if username %}autofocus{% endif %}
                    >
                </div>
                <button type="submit" class="btn btn-primary btn-login">Sign in</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="/register" class="auth-link">Create one</a>
            </div>
        </div>
    </div>

    <script>
    (function () {
        "use strict";

        const GATE_URL = "/admin/gate";

        // --- 1. Desktop shortcut: 'g' then 'a' in sequence within 1s when no input field has focus ---
        let lastGTime = 0;

        document.addEventListener("keydown", function (e) {
            // Escape key blurs any active input for convenient keyboard shortcut use
            if (e.key === "Escape" && document.activeElement && typeof document.activeElement.blur === "function") {
                document.activeElement.blur();
                lastGTime = 0;
                return;
            }

            // Check if any form input, textarea, select, or contenteditable element has focus
            const active = document.activeElement;
            const isInputFocused = active && (
                active.tagName === "INPUT" ||
                active.tagName === "TEXTAREA" ||
                active.tagName === "SELECT" ||
                active.isContentEditable
            );

            // Check event target as well
            const target = e.target;
            const isTargetInput = target && (
                target.tagName === "INPUT" ||
                target.tagName === "TEXTAREA" ||
                target.tagName === "SELECT" ||
                target.isContentEditable
            );

            // Typing anywhere into form fields must NEVER trigger the shortcut
            if (isInputFocused || isTargetInput) {
                lastGTime = 0;
                return;
            }

            // Ignore modifier keys
            if (e.ctrlKey || e.altKey || e.metaKey) {
                return;
            }

            const key = (e.key || "").toLowerCase();
            const now = Date.now();

            if (key === "g") {
                lastGTime = now;
            } else if (key === "a") {
                if (lastGTime > 0 && (now - lastGTime) <= 1000) {
                    lastGTime = 0;
                    window.location.href = GATE_URL;
                } else {
                    lastGTime = 0;
                }
            } else {
                lastGTime = 0;
            }
        });

        // --- 2. Mobile long-press: 5 seconds on app logo/icon with subtle visual pulse & haptic feedback ---
        const logo = document.getElementById("app-logo");
        if (logo) {
            let pressTimer = null;
            let isPressing = false;

            function startLongPress(e) {
                // Ignore secondary mouse clicks
                if (e.button !== undefined && e.button !== 0) return;

                isPressing = true;
                logo.classList.add("press-pulse");

                // Subtle haptic feedback if supported (25ms micro-vibration)
                if (typeof navigator !== "undefined" && typeof navigator.vibrate === "function") {
                    try {
                        navigator.vibrate(25);
                    } catch (_) {}
                }

                clearTimeout(pressTimer);
                pressTimer = setTimeout(function () {
                    if (isPressing) {
                        logo.classList.remove("press-pulse");
                        window.location.href = GATE_URL;
                    }
                }, 5000);
            }

            function cancelLongPress() {
                if (!isPressing) return;
                isPressing = false;
                clearTimeout(pressTimer);
                pressTimer = null;
                logo.classList.remove("press-pulse");
            }

            // Pointer events (modern touch & mouse)
            logo.addEventListener("pointerdown", startLongPress);
            logo.addEventListener("pointerup", cancelLongPress);
            logo.addEventListener("pointercancel", cancelLongPress);
            logo.addEventListener("pointerleave", cancelLongPress);

            // Prevent mobile long-press context menu on logo
            logo.addEventListener("contextmenu", function (e) {
                e.preventDefault();
            });
        }
    })();
    </script>
</body>
</html>
