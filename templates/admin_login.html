<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Admin Login - Prompt Builder</title>
    <link rel="stylesheet" href="/static/style.css?v=20260922">
    <style>
        html, body {
            overflow-x: hidden;
            width: 100%;
        }

        .admin-login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            background-color: var(--bg-base);
            padding: 20px 16px;
            box-sizing: border-box;
        }

        .admin-login-card {
            width: 100%;
            max-width: 380px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 32px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
        }

        .admin-login-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 8px;
        }

        .admin-login-header .admin-icon {
            color: var(--accent-primary);
            margin-bottom: 4px;
        }

        .admin-login-header h1 {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .admin-login-subtitle {
            font-size: 0.88rem;
            color: var(--text-secondary);
        }

        .admin-login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-input {
            background-color: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }

        .form-input:focus {
            border-color: var(--accent-primary);
        }

        .admin-login-error {
            background-color: var(--danger-subtle);
            border: 1px solid var(--danger-color);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            text-align: center;
        }

        .btn-admin-login {
            width: 100%;
            padding: 10px;
            font-size: 0.95rem;
            margin-top: 4px;
        }

        .admin-login-footer {
            margin-top: 8px;
            text-align: center;
            font-size: 0.88rem;
            color: var(--text-secondary);
        }

        .admin-login-link {
            color: var(--accent-primary);
            text-decoration: none;
            font-weight: 500;
        }

        .admin-login-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="admin-login-page">
        <div class="admin-login-card">
            <div class="admin-login-header">
                <div class="admin-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                </div>
                <h1>Admin Authentication</h1>
                <p class="admin-login-subtitle">Sign in with the administrator account</p>
            </div>

            {% if error %}
            <div class="admin-login-error">{{ error }}</div>
            {% endif %}

            <form class="admin-login-form" method="POST" action="/admin/login">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="form-group">
                    <label class="form-label" for="username">Admin Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-input" 
                        placeholder="Enter admin username" 
                        value="{{ username or '' }}"
                        required 
                        {% if not username %}autofocus{% endif %}
                    >
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input" 
                        placeholder="Enter password" 
                        required 
                        {% if username %}autofocus{% endif %}
                    >
                </div>
                <button type="submit" class="btn btn-primary btn-admin-login">Sign In to Dashboard</button>
            </form>

            <div class="admin-login-footer">
                <a href="/login" class="admin-login-link">Return to user login</a>
            </div>
        </div>
    </div>
</body>
</html>
