<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Create Account - PROMPTER</title>
    <link rel="stylesheet" href="/static/style.css?v=20260922">
    <style>
        html, body {
            overflow-x: hidden;
            width: 100%;
        }

        .register-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
            max-width: 100vw;
            box-sizing: border-box;
            background-color: var(--bg-base);
            padding: 20px 16px;
        }

        .register-card {
            width: 100%;
            max-width: 400px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        .register-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 8px;
        }

        .register-header .logo {
            font-size: 1.4rem;
        }

        .register-subtitle {
            font-size: 0.88rem;
            color: var(--text-secondary);
        }

        .register-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-input {
            background-color: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }

        .form-input:focus {
            border-color: var(--accent-primary);
        }

        .register-error {
            background-color: var(--danger-subtle);
            border: 1px solid var(--danger-color);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            text-align: center;
        }

        .btn-register {
            width: 100%;
            padding: 10px;
            font-size: 0.95rem;
            margin-top: 4px;
        }

        .auth-footer {
            margin-top: 8px;
            text-align: center;
            font-size: 0.88rem;
            color: var(--text-secondary);
        }

        .auth-link {
            color: var(--accent-primary);
            text-decoration: none;
            font-weight: 500;
        }

        .auth-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="register-page">
        <div class="register-card">
            <div class="register-header">
                <div class="logo">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                    <h1>PROMPTER</h1>
                </div>
                <p class="register-subtitle">Create an account to save your prompts</p>
            </div>

            {% if error %}
            <div class="register-error">{{ error }}</div>
            {% endif %}

            <form class="register-form" method="POST" action="/register">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-input" 
                        placeholder="Choose a username" 
                        value="{{ username or '' }}"
                        required 
                        autofocus
                    >
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password (min 6 characters)</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input" 
                        placeholder="Choose a password" 
                        required 
                    >
                </div>
                <div class="form-group">
                    <label class="form-label" for="confirm_password">Confirm Password</label>
                    <input 
                        type="password" 
                        id="confirm_password" 
                        name="confirm_password" 
                        class="form-input" 
                        placeholder="Confirm password" 
                        required 
                    >
                </div>
                <button type="submit" class="btn btn-primary btn-register">Create account</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="/login" class="auth-link">Sign in</a>
            </div>
        </div>
    </div>
</body>
</html>
