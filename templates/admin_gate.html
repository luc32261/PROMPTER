<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Gate - Prompt Builder</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        html, body {
            overflow-x: hidden;
            width: 100%;
        }

        .gate-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            background-color: var(--bg-base);
            padding: 20px 16px;
            box-sizing: border-box;
        }

        .gate-card {
            width: 100%;
            max-width: 380px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 32px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
        }

        .gate-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 8px;
        }

        .gate-header .gate-icon {
            color: var(--accent-primary);
            margin-bottom: 4px;
        }

        .gate-header h1 {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .gate-subtitle {
            font-size: 0.88rem;
            color: var(--text-secondary);
        }

        .gate-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-input {
            background-color: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }

        .form-input:focus {
            border-color: var(--accent-primary);
        }

        .gate-error {
            background-color: var(--danger-subtle);
            border: 1px solid var(--danger-color);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            text-align: center;
        }

        .btn-gate {
            width: 100%;
            padding: 10px;
            font-size: 0.95rem;
            margin-top: 4px;
        }

        .gate-footer {
            margin-top: 8px;
            text-align: center;
            font-size: 0.88rem;
            color: var(--text-secondary);
        }

        .gate-link {
            color: var(--accent-primary);
            text-decoration: none;
            font-weight: 500;
        }

        .gate-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="gate-page">
        <div class="gate-card">
            <div class="gate-header">
                <div class="gate-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <h1>Restricted Access</h1>
                <p class="gate-subtitle">Enter the gate password to proceed</p>
            </div>

            {% if error %}
            <div class="gate-error">{{ error }}</div>
            {% endif %}

            <form class="gate-form" method="POST" action="/admin/gate">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="form-group">
                    <label class="form-label" for="gate_password">Gate Password</label>
                    <input 
                        type="password" 
                        id="gate_password" 
                        name="gate_password" 
                        class="form-input" 
                        placeholder="Enter gate password" 
                        required 
                        autofocus
                    >
                </div>
                <button type="submit" class="btn btn-primary btn-gate">Continue</button>
            </form>

            <div class="gate-footer">
                <a href="/login" class="gate-link">Return to login</a>
            </div>
        </div>
    </div>
</body>
</html>
